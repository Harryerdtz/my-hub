<!doctype html><html lang="de"><head><meta charset="utf-8"><title>My Hub</title><style>
:root{color-scheme:dark;font:15px system-ui;background:#11161c;color:#f4f6f7}*{box-sizing:border-box}body{margin:0;padding:28px;background:radial-gradient(circle at 70% 0,#263843,#11161c 55%);min-height:100vh}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#26343c;color:#eef4f5;cursor:pointer}button:hover{filter:brightness(1.15)}button.primary{background:#5eaaa2;color:#0d191b}header{display:flex;align-items:center;gap:16px;margin-bottom:26px}h1{margin:0;font-size:28px}header p{color:#9da9ad;margin:4px 0}.actions{margin-left:auto;display:flex;gap:8px}.layout{display:grid;grid-template-columns:205px 1fr;gap:20px}aside,.card,.panel{background:#ffffff0b;border:1px solid #ffffff16;backdrop-filter:blur(22px) saturate(135%)}aside{border-radius:18px;padding:12px}aside button{display:block;width:100%;text-align:left;background:transparent;margin:3px 0}.selected{background:#5eaaa233!important}.search{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff20;background:#ffffff0b;color:white;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{display:flex;align-items:center;gap:12px;padding:15px;border-radius:15px;text-align:left}.card .icon{font-size:27px}.card small{display:block;color:#9da9ad;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}.empty{padding:60px;text-align:center;color:#9da9ad}.wheel{position:fixed;inset:0;display:none;place-items:center;background:#0006;backdrop-filter:blur(9px)}.wheel.open{display:grid}.ring{width:450px;height:450px;border-radius:50%;background:linear-gradient(145deg,#6b858d99,#17262dcc);border:1px solid #ffffff55;position:relative;box-shadow:0 25px 80px #0009,inset 0 1px #ffffff35;backdrop-filter:blur(28px) saturate(155%);animation:expand .18s ease-out}.ring button{position:absolute;border-radius:50%;width:100px;height:100px;padding:8px;background:#ffffff18;border:1px solid #ffffff28;backdrop-filter:blur(18px);transform:translate(-50%,-50%)}.ring button:nth-child(1){left:50%;top:14%}.ring button:nth-child(2){left:80%;top:34%}.ring button:nth-child(3){left:78%;top:68%}.ring button:nth-child(4){left:22%;top:68%}.ring button:nth-child(5){left:20%;top:34%}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#bce3db;font-size:29px}.close{left:50%!important;top:50%!important;background:#142025dd!important;width:72px!important;height:72px!important}.back{left:50%!important;top:86%!important;width:68px!important;height:42px!important;border-radius:20px!important}@keyframes expand{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}.settings{display:none;max-width:560px}.settings.show{display:block}.panel{border-radius:16px;padding:20px;margin-top:16px}.panel h2{margin-top:0}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ffffff12}.muted{color:#9da9ad}
</style></head><body><header><div><h1>My Hub</h1><p>Apps, Kategorien und Shortcuts an einem Ort</p></div><div class="actions"><button onclick="openWheel()">Radmenü</button><button class="primary" onclick="addApp()">App hinzufügen</button></div></header><div class="layout"><aside id="cats"></aside><main><input id="search" class="search" placeholder="App suchen" oninput="render()"><div id="settings" class="settings panel"><h2>Einstellungen</h2><div class="row"><span>Radmenü beim Start anzeigen</span><input id="autoOpen" type="checkbox"></div><div class="row"><span>Windows-Apps neu erkennen</span><button onclick="refreshApps()">Aktualisieren</button></div><p class="muted">Die Windows-Version nutzt dieselbe Navigation wie My Hub auf dem Mac. Glass-Flächen passen sich an den Hintergrund an.</p></div><div id="cards" class="cards"></div></main></div><div id="wheel" class="wheel" onclick="if(event.target.id==='wheel')closeWheel()"><div class="ring" id="ring"><button onclick="showFavorites()">★<br>Favoriten</button><button onclick="showCategories()">▦<br>Kategorien</button><button onclick="selectCat('Medien')">Medien</button><button onclick="selectCat('Kreativ')">Kreativ</button><button onclick="selectCat('Coding')">Coding</button><button class="close" onclick="closeWheel()">×</button><button class="back" id="back" onclick="showFavorites()">Zurück</button><div class="center">My Hub</div></div></div><script>
const defaultCats=['Alle','Favoriten','Coding','Kreativ','Medien','Kommunikation','Spiele','Werkzeuge'];let apps=[],cat='Alle';const icons={Coding:'⌘',Kreativ:'✦',Medien:'▶',Kommunikation:'◌',Spiele:'♢',Werkzeuge:'⚙',Alle:'▦',Favoriten:'★'};function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function categoryFor(name){const n=name.toLowerCase();if(/code|studio|terminal|powershell|git|xcode/.test(n))return'Coding';if(/spotify|music|vlc|video|media|podcast/.test(n))return'Medien';if(/steam|game|minecraft|epic|riot/.test(n))return'Spiele';if(/discord|slack|teams|whatsapp|mail|zoom/.test(n))return'Kommunikation';if(/photo|paint|figma|affinity|blender|creative/.test(n))return'Kreativ';return'Werkzeuge'}async function init(){apps=(await myHub.installedApps()).map(a=>({...a,category:categoryFor(a.name)}));renderCats();render()}function renderCats(){document.getElementById('cats').innerHTML=defaultCats.map(c=>`<button class="${cat===c?'selected':''}" onclick="selectCat('${c}')">${icons[c]} &nbsp;${c}</button>`).join('')+`<button onclick="toggleSettings()">⚙ &nbsp;Einstellungen</button>`}function selectCat(c){cat=c;document.getElementById('settings').classList.remove('show');renderCats();render();closeWheel()}function render(){const q=document.getElementById('search').value.toLowerCase();const list=apps.filter(a=>(cat==='Alle'||(cat==='Favoriten'?a.favorite:a.category===cat))&&a.name.toLowerCase().includes(q));document.getElementById('cards').innerHTML=list.length?list.map(a=>`<button class="card" onclick="myHub.openPath('${a.path.replaceAll('\\','\\\\').replaceAll("'","\\'")}')"><span class="icon">▣</span><span><b>${safe(a.name)}</b><small>${safe(a.path)}</small></span></button>`).join(''):'<div class="empty">Hier ist noch nichts. Füge eine App hinzu oder wähle eine andere Kategorie.</div>'}function addApp(){myHub.pickApp().then(p=>{if(p){apps.push({name:p.split('\\').pop().replace(/\.(exe|lnk)$/i,''),path:p,category:categoryFor(p),favorite:true});cat='Favoriten';renderCats();render()}})}function refreshApps(){myHub.installedApps().then(list=>{apps=list.map(a=>({...a,category:categoryFor(a.name)}));render()})}function toggleSettings(){document.getElementById('settings').classList.toggle('show');closeWheel()}function openWheel(){document.getElementById('wheel').classList.add('open');showFavorites()}function closeWheel(){document.getElementById('wheel').classList.remove('open')}function showFavorites(){document.getElementById('back').style.display='none';const b=[...document.querySelectorAll('#ring>button')].slice(0,5);b[0].innerHTML='★<br>Favoriten';b[1].innerHTML='▦<br>Kategorien';b[2].innerHTML='Medien';b[3].innerHTML='Kreativ';b[4].innerHTML='Coding'}function showCategories(){document.getElementById('back').style.display='block';const b=[...document.querySelectorAll('#ring>button')].slice(0,5);['Coding','Kreativ','Medien','Kommunikation','Spiele'].forEach((c,i)=>b[i].innerHTML=`${icons[c]}<br>${c}`)}init();
</script></body></html>
